<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brandmark"><img src="record-shelf-icon.png?v=2" alt="Record Shelf icon"></div><div><h1>Record Shelf</h1><small>Your vinyl, beautifully catalogued</small></div></div><div class="actions"><button class="iconbtn" id="backupBtn" title="Backup or restore" aria-label="Backup or restore">↕ <span class="label">Backup</span></button><button class="btn primary" id="addBtn" aria-label="Add record">＋ <span class="add-label">Add record</span></button></div></header>
    <section class="hero"><div class="eyebrow">The collection</div><h2>Music you can<br>hold onto.</h2><p>A visual home for every record on your shelf—and every one still on your list.</p><div class="summary"><span><strong id="recordCount">0</strong>records</span><span><strong id="artistCount">0</strong>artists</span></div></section>
    <nav class="tabs" aria-label="Library views"><button class="tab active" data-view="owned">My Collection</button><button class="tab" data-view="wishlist">Wishlist</button><button class="tab" data-view="rate">Quick Rate</button></nav>
    <section class="toolbar" id="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search artists or albums" aria-label="Search artists or albums"></label><select id="sort" aria-label="Sort"><option value="artist">Artist A–Z</option><option value="priority">Must-have first</option><option value="album">Album A–Z</option><option value="year">Newest first</option></select><button class="iconbtn" id="expandBtn" title="Expand or collapse all">Expand all</button></section>
    <section id="artistList" class="artist-list" aria-live="polite"></section>
    <section id="quickRate" class="quick-rate" aria-live="polite" hidden></section>
  </main>

  <dialog id="detailDialog"><div id="detail"></div></dialog>
  <dialog id="editDialog"><form method="dialog" class="form" id="editForm"><button class="close" value="cancel" aria-label="Close">×</button><h2 id="formTitle">Add a record</h2><input type="hidden" id="recordId"><div class="grid">
    <div class="field"><label for="artistInput">Artist</label><input id="artistInput" required autocomplete="off"></div><div class="field"><label for="albumInput">Album</label><input id="albumInput" required autocomplete="off"></div>
    <div class="field"><label for="yearInput">Year</label><input id="yearInput" inputmode="numeric" placeholder="Optional"></div><div class="field"><label for="statusInput">Shelf</label><select id="statusInput"><option value="owned">My Collection</option><option value="wishlist">Wishlist</option></select></div>
    <div class="field full" id="priorityField"><label for="priorityInput">How much do you want it?</label><select id="priorityInput"><option value="0">Not rated yet</option><option value="1">1 — I want it</option><option value="2">2 — I really want this</option><option value="3">3 — Must have</option></select></div>
    <div class="field full"><label for="coverInput">Artwork URL (optional)</label><input id="coverInput" type="url" placeholder="Automatically matched if left blank"></div><div class="field full"><label for="tracksInput">Tracklist — one song per line</label><textarea id="tracksInput" placeholder="Automatically loaded when available"></textarea></div>
  </div><div class="form-actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="saveBtn" value="default">Save record</button></div></form></dialog>
  <dialog id="backupDialog"><div class="form"><button class="close" onclick="backupDialog.close()">×</button><h2>Backup & restore</h2><p style="color:var(--muted)">Download a portable copy of your catalog or restore one you saved earlier.</p><div class="form-actions" style="justify-content:flex-start"><button class="btn primary" id="exportBtn">Download backup</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" id="importFile" accept="application/json" hidden></label><button class="btn" id="resetBtn">Reset sample catalog</button></div></div></dialog>

    function fallback(r){const h=hash(r.artist+r.album),a=h%360,b=(h+48)%360;return `<div class="fallback" style="--c1:hsl(${a} 56% 42%);--c2:hsl(${b} 60% 18%)">${esc(r.album)}</div>`}
    function verifiedCover(r){return coverOverrides[`${norm(r.artist)}|${norm(r.album)}`]||r.cover||''}
    window.retryCover=(img,fallbackHtml)=>{const attempt=+(img.dataset.retry||0);if(attempt<3&&/is\d-ssl\.mzstatic\.com/.test(img.src)){img.dataset.retry=attempt+1;img.src=img.src.replace(/is\d-ssl/,`is${attempt+2}-ssl`)}else img.outerHTML=decodeURIComponent(fallbackHtml)};
    function art(r,size=300){const cover=verifiedCover(r),src=cover?esc(cover.replace(/\/\d+x\d+bb\./,`/${size}x${size}bb.`)):'';return src?`<img class="album-cover" src="${src}" alt="${esc(r.album)} cover" loading="eager" decoding="async" onerror="retryCover(this,'${encodeURIComponent(fallback(r))}')">`:fallback(r)}
    async function findArt(r){if(verifiedCover(r)||r.artTried)return;r.artTried=true;try{let candidates=[];for(const phrase of [`${r.artist} ${r.album}`,r.artist]){const term=encodeURIComponent(phrase),res=await fetch(`https://itunes.apple.com/search?term=${term}&entity=album&limit=100&country=US`),data=await res.json();candidates.push(...(data.results||[]));const ranked=candidates.map(x=>[scoreMatch(r,x),x]).sort((a,b)=>b[0]-a[0]);if(ranked[0]&&ranked[0][0]>=68){const c=ranked[0][1];r.cover=c.artworkUrl100?.replace('100x100bb','600x600bb')||'';r.collectionId=c.collectionId||null;if(!r.year&&c.releaseDate)r.year=+c.releaseDate.slice(0,4);save();render();if(detailId===r.id)openDetail(r.id);return}}}catch(e){} }
    function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function priorityLabel(n){return +n===3?'Must have':+n===2?'Really want':'Want it'}
    function priorityValue(r){return r.priorityRated?(r.priority||1):0}
    function visible(){const q=norm(query);return records.filter(r=>r.status===view&&(!q||norm(r.artist+' '+r.album).includes(q))).sort((a,b)=>{const mode=$('#sort').value;if(mode==='priority')return priorityValue(b)-priorityValue(a)||a.artist.localeCompare(b.artist)||a.album.localeCompare(b.album);if(mode==='year')return (b.year||0)-(a.year||0)||a.album.localeCompare(b.album);if(mode==='album')return a.album.localeCompare(b.album);return a.artist.localeCompare(b.artist)||a.album.localeCompare(b.album)})}
    function renderQuickRate(){document.body.classList.add('rating-mode');const wishlist=records.filter(r=>r.status==='wishlist'),unrated=wishlist.filter(r=>!r.priorityRated),rated=wishlist.length-unrated.length,r=unrated[0];$('#toolbar').hidden=true;list.hidden=true;$('#quickRate').hidden=false;$('#recordCount').textContent=wishlist.length;$('#artistCount').textContent=new Set(wishlist.map(r=>norm(r.artist))).size;if(!r){$('#quickRate').innerHTML=`<div class="rate-complete"><div class="done-mark">✓</div><h2>Wishlist rated</h2><p>You’ve rated all ${wishlist.length} records. Your priorities are ready to browse.</p><button class="btn primary" data-view-jump="wishlist">Review wishlist</button></div>`;return}const pct=wishlist.length?Math.round(rated/wishlist.length*100):0;$('#quickRate').innerHTML=`<div class="rate-intro"><div class="eyebrow">Quick Rate</div><p>${rated} rated · ${unrated.length} left</p><div class="rate-progress"><i style="width:${pct}%"></i></div></div><div class="rate-card"><div class="rate-art"><div class="cover-wrap">${art(r,600)}</div></div><div class="rate-info"><div class="eyebrow">How badly do you want it?</div><h2>${esc(r.album)}</h2><p class="artist-name">${esc(r.artist)}${r.year?' · '+r.year:''}</p><p class="rate-prompt">Choose a rating</p><div class="quick-options">${[1,2,3].map(n=>`<button class="quick-rate-btn level-${n}" data-quick-rate="${n}" data-id="${r.id}"><strong>${n}</strong><span>${priorityLabel(n)}</span></button>`).join('')}</div><p class="key-hint">Tip: press 1, 2, or 3 on your keyboard</p></div></div>`;if(!verifiedCover(r)&&!r.artTried)findArt(r)}
    function render(){if(view==='rate')return renderQuickRate();document.body.classList.remove('rating-mode');$('#toolbar').hidden=false;list.hidden=false;$('#quickRate').hidden=true;const rows=visible(),groups=new Map();rows.forEach(r=>{if(!groups.has(r.artist))groups.set(r.artist,[]);groups.get(r.artist).push(r)});$('#recordCount').textContent=records.filter(r=>r.status===view).length;$('#artistCount').textContent=new Set(records.filter(r=>r.status===view).map(r=>norm(r.artist))).size;
      if(!rows.length){list.innerHTML=`<div class="empty"><h3>No records found</h3><p>Try another search or add a record to this shelf.</p></div>`;return}
      list.innerHTML=[...groups].map(([artist,albums])=>{const open=expanded.has(artist);return `<article class="artist ${open?'open':''}" data-artist="${esc(artist)}"><button class="artist-head" aria-expanded="${open}"><div class="artist-meta"><h3>${esc(artist)}</h3><p>${albums.length} ${albums.length===1?'record':'records'}</p></div><div class="mini-covers" aria-hidden="true">${albums.slice(0,5).map(r=>`<div class="mini-cover">${art(r,100)}</div>`).join('')}</div><span class="chev">⌄</span></button><div class="albums">${albums.map(r=>`<div class="album-card" tabindex="0" role="button" data-id="${r.id}"><div class="cover-wrap">${art(r)}${r.status==='wishlist'?'<i class="status-dot"></i>':''}</div><h4>${esc(r.album)}</h4><p>${r.year||'Year unknown'}</p>${r.status==='wishlist'?`<span class="priority-pill level-${priorityValue(r)}">${r.priorityRated?priorityLabel(r.priority):'Not rated'}</span>`:''}</div>`).join('')}</div></article>`}).join('');
      rows.filter(r=>!r.cover&&!r.artTried).slice(0,8).forEach(findArt)
    }
    async function loadTracks(r){if(r.tracks?.length||!r.collectionId)return;r.loadingTracks=true;openDetail(r.id);try{const res=await fetch(`https://itunes.apple.com/lookup?id=${r.collectionId}&entity=song`),d=await res.json();r.tracks=(d.results||[]).filter(x=>x.wrapperType==='track').map(x=>x.trackName);save()}catch{}delete r.loadingTracks;if(detailId===r.id)openDetail(r.id)}
    function openDetail(id){const r=records.find(x=>x.id===id);if(!r)return;detailId=id;const q=encodeURIComponent(`${r.artist} ${r.album} vinyl`),artistQ=encodeURIComponent(`${r.artist} official store vinyl`);$('#detail').innerHTML=`<div class="detail"><div class="detail-art"><div class="cover-wrap">${art(r,600)}</div></div><div class="detail-body"><button class="close" onclick="detailDialog.close()">×</button><div class="eyebrow">${r.status==='owned'?'In your collection':'On your wishlist'}</div><h2>${esc(r.album)}</h2><p class="artist-name">${esc(r.artist)}${r.year?' · '+r.year:''}</p>${r.status==='wishlist'?`<div class="want-level"><span>How much do you want it?</span><div class="rating-options">${[1,2,3].map(n=>`<button class="rating-btn ${r.priorityRated&&+(r.priority||1)===n?'active':''}" data-priority="${n}" data-id="${r.id}">${n} · ${priorityLabel(n)}</button>`).join('')}</div></div>`:''}<div class="detail-actions"><button class="btn" data-edit="${r.id}">Edit</button><button class="btn" data-move="${r.id}">${r.status==='owned'?'Move to wishlist':'Add to collection'}</button><button class="btn" data-delete="${r.id}">Delete</button></div><h3 class="track-title">Tracklist</h3>${r.loadingTracks?'<p style="color:var(--muted)">Loading tracklist…</p>':r.tracks?.length?`<ol class="tracklist">${r.tracks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:'<p style="color:var(--muted)">No tracklist available yet. Choose Edit to add one.</p>'}<div class="purchase"><a class="btn primary" href="https://www.google.com/search?q=${artistQ}" target="_blank" rel="noopener">Find artist store ↗</a><a class="btn" href="https://www.amazon.com/s?k=${q}" target="_blank" rel="noopener">Amazon ↗</a><a class="btn" href="https://www.discogs.com/search/?q=${q}&type=release" target="_blank" rel="noopener">Discogs ↗</a></div></div></div>`;$('#detailDialog').showModal();if(!r.tracks?.length&&!r.loadingTracks)loadTracks(r)}
    function togglePriorityField(){$('#priorityField').hidden=$('#statusInput').value!=='wishlist'}
    function editRecord(id){const r=id?records.find(x=>x.id===id):null;$('#formTitle').textContent=r?'Edit record':'Add a record';$('#recordId').value=r?.id||'';$('#artistInput').value=r?.artist||'';$('#albumInput').value=r?.album||'';$('#yearInput').value=r?.year||'';$('#statusInput').value=r?.status||(view==='rate'?'wishlist':view);$('#priorityInput').value=r?.priorityRated?(r.priority||1):0;togglePriorityField();$('#coverInput').value=r?.cover||'';$('#tracksInput').value=(r?.tracks||[]).join('\n');$('#editDialog').showModal()}
    list.addEventListener('click',e=>{const card=e.target.closest('.album-card');if(card)return openDetail(card.dataset.id);const head=e.target.closest('.artist-head');if(head){const artist=head.closest('.artist').dataset.artist;expanded.has(artist)?expanded.delete(artist):expanded.add(artist);render()}});list.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.album-card'))openDetail(e.target.dataset.id)});
    function setQuickRating(id,n){const r=records.find(x=>x.id===id&&x.status==='wishlist');if(!r)return;r.priority=+n;r.priorityRated=true;save();render();show(`Rated ${n} · ${priorityLabel(n)}`)}
    document.addEventListener('click',e=>{const qr=e.target.closest('[data-quick-rate]'),jump=e.target.closest('[data-view-jump]'),pr=e.target.closest('[data-priority]'),ed=e.target.closest('[data-edit]'),mv=e.target.closest('[data-move]'),del=e.target.closest('[data-delete]');if(qr){setQuickRating(qr.dataset.id,qr.dataset.quickRate);return}if(jump){document.querySelector(`.tab[data-view="${jump.dataset.viewJump}"]`)?.click();return}if(pr){const r=records.find(x=>x.id===pr.dataset.id);if(r){r.priority=+pr.dataset.priority;r.priorityRated=true;save();openDetail(r.id);render();show(`Marked “${priorityLabel(r.priority)}”`)}return}if(ed){detailDialog.close();editRecord(ed.dataset.edit)}if(mv){const r=records.find(x=>x.id===mv.dataset.move);r.status=r.status==='owned'?'wishlist':'owned';if(r.status==='wishlist'){r.priority=r.priority||1;r.priorityRated=false}save();detailDialog.close();show('Record moved');render()}if(del&&confirm('Delete this record from your catalog?')){records=records.filter(x=>x.id!==del.dataset.delete);save();detailDialog.close();show('Record deleted');render()}})
    $('#saveBtn').addEventListener('click',e=>{e.preventDefault();if(!$('#artistInput').value.trim()||!$('#albumInput').value.trim())return $('#editForm').reportValidity();const id=$('#recordId').value,r=records.find(x=>x.id===id),p=+$('#priorityInput').value,data={artist:$('#artistInput').value.trim(),album:$('#albumInput').value.trim(),year:+$('#yearInput').value||'',status:$('#statusInput').value,priority:p||1,priorityRated:$('#statusInput').value==='wishlist'&&p>0,cover:$('#coverInput').value.trim(),tracks:$('#tracksInput').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(r){Object.assign(r,data);if(!data.cover)r.artTried=false}else records.push({id:'r-'+Date.now(),...data,collectionId:null});save();$('#editDialog').close();show(r?'Record updated':'Record added');render()});
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));expanded.clear();allOpen=false;$('#expandBtn').textContent='Expand all';render()});document.addEventListener('keydown',e=>{if(view!=='rate'||!['1','2','3'].includes(e.key)||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const r=records.find(x=>x.status==='wishlist'&&!x.priorityRated);if(r)setQuickRating(r.id,+e.key)});$('#search').oninput=e=>{query=e.target.value;render()};$('#sort').onchange=render;$('#statusInput').onchange=togglePriorityField;$('#addBtn').onclick=()=>editRecord();$('#backupBtn').onclick=()=>$('#backupDialog').showModal();
    let allOpen=false;$('#expandBtn').onclick=()=>{allOpen=!allOpen;expanded.clear();if(allOpen)visible().forEach(r=>expanded.add(r.artist));$('#expandBtn').textContent=allOpen?'Collapse all':'Expand all';render()};
    $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Record Shelf',version:3,exported:new Date().toISOString(),records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`record-shelf-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);show('Backup downloaded')};
    $('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),items=Array.isArray(data)?data:data.records;if(!Array.isArray(items))throw Error();records=items;migrateCatalog();save();backupDialog.close();render();show('Backup restored')}catch{alert('That file is not a valid Record Shelf backup.')}};
    $('#resetBtn').onclick=()=>{if(confirm('Replace your current catalog with the original sample catalog?')){records=makeSeeds();save();backupDialog.close();render();show('Catalog reset')}};
    function show(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    [$('#detailDialog'),$('#editDialog'),$('#backupDialog')].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
    if(location.protocol==='http:'||location.protocol==='https:'){navigator.serviceWorker?.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});window.caches?.delete('record-shelf-v1').catch(()=>{})}
    render();
  })();
  </script>
</body>
